<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>影片播放器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #0e1117;
            --surface:   #141920;
            --panel:     #1b2430;
            --border:    #243040;
            --border-hi: #c8833a;

            --amber:     #c8833a;
            --amber-lo:  #a8612a;
            --amber-hi:  #e8a050;
            --amber-dim: rgba(200,131,58,0.12);

            --teal:      #2f8f8a;
            --teal-hi:   #3dbcb6;
            --teal-dim:  rgba(47,143,138,0.12);

            --text:      #d4c9b8;
            --text-dim:  #7e8a96;
            --text-faint:#3e4a56;

            --danger:    #b84a3a;
            --danger-hi: #d86050;

            --radius-xl: 16px;
            --radius-lg: 12px;
            --radius-sm: 8px;
            --radius-pill: 999px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-family: 'DM Mono', monospace;
            display: flex;
            justify-content: center;
            padding: 24px 16px 40px;
            background-image:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(47,143,138,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 85% 80%, rgba(200,131,58,0.05) 0%, transparent 55%);
        }

        /* ─── Layout ─────────────────────────────── */
        .wrap {
            max-width: 1060px;
            width: 100%;
            display: grid;
            gap: 20px;
        }

        /* ─── Header ─────────────────────────────── */
        .header {
            display: flex;
            align-items: baseline;
            gap: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-style: italic;
            font-size: 2rem;
            color: var(--amber-hi);
            letter-spacing: 0.03em;
        }
        .header .sub {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .dot-accent {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--teal);
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 6px var(--teal);
        }

        /* ─── Video ──────────────────────────────── */
        .video-wrap {
            background: #000;
            border-radius: var(--radius-xl);
            overflow: hidden;
            aspect-ratio: 16 / 9;
            border: 1px solid var(--border);
            position: relative;
            box-shadow:
                0 0 0 1px rgba(200,131,58,0.08),
                0 24px 60px rgba(0,0,0,0.6);
            cursor: pointer;
        }
        .video-wrap:fullscreen,
        .video-wrap:-webkit-full-screen,
        .video-wrap:-moz-full-screen {
            border-radius: 0;
            aspect-ratio: unset;
            width: 100vw;
            height: 100vh;
        }
        video {
            width: 100%; height: 100%;
            display: block;
            background: #000;
        }

        /* ─── Custom Controls ────────────────────── */
        .ctrl-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 0 18px 16px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 55%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 10;
        }
        .video-wrap:hover .ctrl-bar,
        .video-wrap.ctrl-visible .ctrl-bar {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        /* Progress bar */
        .ctrl-progress {
            position: relative;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            cursor: pointer;
            transition: height 0.15s;
            margin: 0 2px;
        }
        .ctrl-bar:hover .ctrl-progress,
        .ctrl-progress:hover { height: 6px; }
        .ctrl-progress-buf {
            position: absolute;
            left: 0; top: 0; height: 100%;
            background: rgba(255,255,255,0.14);
            border-radius: 4px;
            pointer-events: none;
        }
        .ctrl-progress-fill {
            position: absolute;
            left: 0; top: 0; height: 100%;
            background: var(--amber);
            border-radius: 4px;
            pointer-events: none;
            transition: width 0.1s linear;
        }
        .ctrl-progress-thumb {
            position: absolute;
            top: 50%;
            width: 14px; height: 14px;
            background: var(--amber-hi);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.15s;
            pointer-events: none;
            box-shadow: 0 0 8px rgba(200,131,58,0.7);
        }
        .ctrl-progress:hover .ctrl-progress-thumb { transform: translate(-50%, -50%) scale(1); }

        /* Bottom row */
        .ctrl-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Play button — distinct pill shape */
        .ctrl-btn-play {
            background: var(--amber);
            border: none;
            color: #0e1117;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
            font-size: 0;
            letter-spacing: 0;
            text-transform: none;
            box-shadow: 0 2px 10px rgba(200,131,58,0.4);
        }
        .ctrl-btn-play:hover {
            background: var(--amber-hi);
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(200,131,58,0.55);
        }
        .ctrl-btn-play:active { transform: scale(0.95); }
        /* Playing state: outlined ring instead of filled */
        .ctrl-btn-play.is-playing {
            background: rgba(200,131,58,0.15);
            border: 1.5px solid var(--amber);
            color: var(--amber-hi);
            box-shadow: none;
        }
        .ctrl-btn-play.is-playing:hover {
            background: rgba(200,131,58,0.28);
            box-shadow: 0 0 12px rgba(200,131,58,0.3);
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.75);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background 0.15s;
            font-family: 'DM Mono', monospace;
            font-size: 0;
            letter-spacing: 0;
            text-transform: none;
            min-width: 36px; min-height: 36px;
        }
        .ctrl-btn:hover { color: var(--amber-hi); background: rgba(255,255,255,0.1); }
        .ctrl-time {
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.05em;
            white-space: nowrap;
            user-select: none;
            padding: 0 4px;
        }
        .ctrl-spacer { flex: 1; }
        .ctrl-vol-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ctrl-vol {
            -webkit-appearance: none;
            appearance: none;
            width: 72px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.18);
            outline: none;
            cursor: pointer;
        }
        .ctrl-vol::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px; height: 13px;
            border-radius: 50%;
            background: var(--amber);
            cursor: pointer;
            box-shadow: 0 0 4px rgba(200,131,58,0.5);
        }
        .ctrl-vol::-moz-range-thumb {
            width: 13px; height: 13px;
            border-radius: 50%;
            background: var(--amber);
            border: none;
            cursor: pointer;
        }
        /* Overlay play button when paused */
        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .play-overlay.show { opacity: 1; }
        .play-overlay-circle {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            border: 1.5px solid rgba(200,131,58,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--amber-hi);
        }
        /* Click ripple */
        @keyframes ripple {
            0%   { transform: translate(-50%,-50%) scale(0.5); opacity: 0.6; }
            100% { transform: translate(-50%,-50%) scale(2.2); opacity: 0; }
        }
        .ripple {
            position: absolute;
            width: 60px; height: 60px;
            border-radius: 50%;
            background: rgba(200,131,58,0.25);
            pointer-events: none;
            animation: ripple 0.45s ease-out forwards;
        }

        /* ─── Config Panel ───────────────────────── */
        .config {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: flex-end;
        }
        .field {
            flex: 1 1 240px;
            min-width: 190px;
        }
        .field label {
            display: block;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 7px;
        }
        .field input {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 16px;
            border-radius: var(--radius-pill);
            font-family: 'DM Mono', monospace;
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.18s, background 0.18s;
            letter-spacing: 0.02em;
        }
        .field input::placeholder { color: var(--text-faint); }
        .field input:focus {
            border-color: var(--teal);
            background: #1a2530;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-left: auto;
        }

        /* ─── Buttons ─────────────────────────────── */
        button {
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: var(--radius-pill);
            padding: 10px 22px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--amber);
            border-color: var(--amber-lo);
            color: #0e1117;
            font-weight: 500;
        }
        .btn-primary:hover {
            background: var(--amber-hi);
            box-shadow: 0 0 16px rgba(200,131,58,0.3);
        }
        .btn-ghost {
            background: transparent;
            border-color: var(--border);
            color: var(--text-dim);
        }
        .btn-ghost:hover {
            border-color: var(--danger);
            color: var(--danger-hi);
            background: rgba(184,74,58,0.08);
        }
        .btn-text {
            background: none;
            border: none;
            color: var(--text-dim);
            padding: 4px 8px;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-decoration: underline dotted;
            text-underline-offset: 3px;
        }
        .btn-text:hover { color: var(--amber); }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ─── Playlist ───────────────────────────── */
        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .playlist-title {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .count-tag {
            background: var(--teal-dim);
            border: 1px solid rgba(47,143,138,0.25);
            color: var(--teal-hi);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            padding: 2px 10px;
            border-radius: var(--radius-pill);
        }

        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
            padding: 2px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .playlist-grid::-webkit-scrollbar { width: 4px; }
        .playlist-grid::-webkit-scrollbar-track { background: transparent; }
        .playlist-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.15s, background 0.15s;
            user-select: none;
        }
        .item:hover {
            border-color: var(--teal);
            background: var(--teal-dim);
        }
        .item.active {
            background: var(--amber-dim);
            border-color: var(--amber);
        }
        .item .num {
            font-size: 0.65rem;
            color: var(--text-faint);
            min-width: 22px;
            text-align: right;
        }
        .item.active .num { color: var(--amber); }
        .item .name {
            flex: 1;
            font-size: 0.78rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
            letter-spacing: 0.01em;
        }
        .item.active .name { color: var(--amber-hi); }
        .play-icon {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 6px var(--amber);
            flex-shrink: 0;
        }

        .empty {
            grid-column: 1/-1;
            padding: 50px 0;
            text-align: center;
            color: var(--text-faint);
            font-size: 0.78rem;
            letter-spacing: 0.15em;
        }

        /* ─── Footer ─────────────────────────────── */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-faint);
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            padding-top: 4px;
        }
        .status-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--teal);
            display: inline-block;
            margin-right: 6px;
            animation: pulse 2.4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.3; }
        }

        /* ─── Error ──────────────────────────────── */
        .error {
            background: rgba(184,74,58,0.1);
            border: 1px solid rgba(184,74,58,0.3);
            color: var(--danger-hi);
            border-radius: var(--radius-sm);
            padding: 10px 18px;
            font-size: 0.78rem;
            letter-spacing: 0.05em;
            display: none;
        }

        /* ─── Divider ─────────────────────────────── */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border) 20%, var(--border) 80%, transparent);
            margin: 0;
        }

        /* ─── Fullscreen button (inline in ctrl-bar) ── */
        #fsBtn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.75);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px; min-height: 36px;
            transition: color 0.15s, background 0.15s;
            font-size: 0;
            letter-spacing: 0;
            text-transform: none;
            flex-shrink: 0;
        }
        #fsBtn:hover {
            color: var(--amber-hi);
            background: rgba(255,255,255,0.1);
        }
        #fsBtn:active { transform: scale(0.92); }
        #fsBtn.is-fullscreen { color: var(--amber); }
        #fsBtn.is-fullscreen:hover {
            color: var(--danger-hi);
            background: rgba(184,74,58,0.15);
        }
    </style>
</head>
<body>
<div class="wrap" id="app">

    <!-- Header -->
    <div class="header">
        <h1>影片播放器</h1>
        <span class="sub"><span class="dot-accent"></span>Alist Stream</span>
    </div>

    <!-- Video -->
    <div class="video-wrap">
        <video id="videoPlayer" crossorigin="anonymous" preload="metadata"></video>

        <!-- Pause overlay -->
        <div class="play-overlay show" id="playOverlay">
            <div class="play-overlay-circle">
                <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                    <path id="overlayIcon" d="M8 5l10 6-10 6V5z" fill="currentColor"/>
                </svg>
            </div>
        </div>

        <!-- Custom control bar -->
        <div class="ctrl-bar" id="ctrlBar">
            <div class="ctrl-progress" id="ctrlProgress">
                <div class="ctrl-progress-buf" id="ctrlBuf"></div>
                <div class="ctrl-progress-fill" id="ctrlFill"></div>
                <div class="ctrl-progress-thumb" id="ctrlThumb"></div>
            </div>
            <div class="ctrl-row">
                <button class="ctrl-btn-play" id="ctrlPlay" title="播放/暫停">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" id="ctrlPlayIcon">
                        <path d="M6 4l9 5-9 5V4z" fill="currentColor"/>
                    </svg>
                </button>
                <button class="ctrl-btn" id="ctrlSkipB" title="後退10秒">
                    <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M3 8a5 5 0 1 0 .9-2.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3 3v3h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="5.5" y="10.5" font-size="4" fill="currentColor" font-family="monospace">10</text></svg>
                </button>
                <button class="ctrl-btn" id="ctrlSkipF" title="快進10秒">
                    <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M13 8a5 5 0 1 1-.9-2.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M13 3v3h-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="4.5" y="10.5" font-size="4" fill="currentColor" font-family="monospace">10</text></svg>
                </button>
                <div class="ctrl-vol-wrap">
                    <button class="ctrl-btn" id="ctrlMute" title="靜音">
                        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" id="ctrlVolIcon">
                            <path d="M3 6H1v4h2l4 3V3L3 6z" fill="currentColor"/>
                            <path d="M11 5a3 3 0 0 1 0 6M13 3a6 6 0 0 1 0 10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <input type="range" class="ctrl-vol" id="ctrlVol" min="0" max="1" step="0.02" value="1">
                </div>
                <span class="ctrl-spacer"></span>
                <span class="ctrl-time" id="ctrlTime">0:00 / 0:00</span>
                <button id="fsBtn" title="全螢幕播放">
                    <svg id="fsIconExpand" width="18" height="18" viewBox="0 0 20 20" fill="none">
                        <path d="M3 8V3h5M17 8V3h-5M3 12v5h5M17 12v5h-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <svg id="fsIconCompress" width="18" height="18" viewBox="0 0 20 20" fill="none" style="display:none">
                        <path d="M8 3v5H3M12 3v5h5M8 17v-5H3M12 17v-5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Config -->
    <div class="config">
        <div class="field">
            <label>Alist 伺服器</label>
            <input type="url" id="serverInput" placeholder="https://alist.example.com" />
        </div>
        <div class="field">
            <label>目錄路徑</label>
            <input type="text" id="pathInput" placeholder="/視頻/合集" value="/" />
        </div>
        <div class="btn-row">
            <button id="loadListBtn" class="btn-primary">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 6a5 5 0 0 1 9.5-2M11 6a5 5 0 0 1-9.5 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8.5 1.5 10.5 4l-2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                加載列表
            </button>
            <button id="clearStorageBtn" class="btn-ghost">
                <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 3h8M4 3V2h3v1M2.5 3l.5 6.5h5L9 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                清除存儲
            </button>
        </div>
    </div>

    <div class="divider"></div>

    <!-- Playlist header -->
    <div class="playlist-header">
        <span class="playlist-title">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 2h8M1 5h6M1 8h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            播放列表
        </span>
        <span class="count-tag" id="countBadge">0 個</span>
    </div>

    <!-- Playlist grid -->
    <div id="playlistContainer" class="playlist-grid">
        <div class="empty">— 輸入地址後點擊加載 —</div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <span><span class="status-dot"></span>進度自動保存中</span>
        <button id="resetProgressBtn" class="btn-text">重置當前進度</button>
    </div>

    <div id="errorMessage" class="error"></div>

</div>

<script>
(function(){
    const STORAGE_KEY = 'alist_loop_player_v1';

    const serverInput   = document.getElementById('serverInput');
    const pathInput     = document.getElementById('pathInput');
    const loadListBtn   = document.getElementById('loadListBtn');
    const clearStorageBtn = document.getElementById('clearStorageBtn');
    const resetProgressBtn = document.getElementById('resetProgressBtn');
    const video         = document.getElementById('videoPlayer');
    const playlistContainer = document.getElementById('playlistContainer');
    const countBadge    = document.getElementById('countBadge');
    const errorDiv      = document.getElementById('errorMessage');

    let currentServer = '';
    let currentPath   = '';
    let playlist      = [];
    let currentIndex  = -1;
    let progressMap   = new Map();

    function loadFromStorage() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return false;
            const data = JSON.parse(saved);
            if (data.server && data.path && Array.isArray(data.playlist) && typeof data.currentIndex === 'number' && data.progressMap) {
                currentServer = data.server;
                currentPath   = data.path;
                playlist      = data.playlist;
                currentIndex  = data.currentIndex;
                progressMap   = new Map(Object.entries(data.progressMap || {}));
                serverInput.value = currentServer;
                pathInput.value   = currentPath;
                renderPlaylist();
                updateCount();
                if (playlist.length > 0 && currentIndex >= 0 && currentIndex < playlist.length) {
                    loadVideoByIndex(currentIndex, true);
                } else {
                    currentIndex = playlist.length > 0 ? 0 : -1;
                }
                return true;
            }
        } catch(e) { console.warn('讀取存儲失敗', e); }
        return false;
    }

    function saveFullState() {
        try {
            const progressObj = Object.fromEntries(progressMap);
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                server: currentServer, path: currentPath,
                playlist, currentIndex, progressMap: progressObj
            }));
        } catch(e) { console.warn('保存失敗', e); }
    }

    function saveCurrentProgress() {
        if (!video || !video.src || currentIndex < 0 || currentIndex >= playlist.length) return;
        const file = playlist[currentIndex];
        if (!file) return;
        if (video.currentTime > 1) {
            progressMap.set(file.path, video.currentTime);
            saveFullState();
        }
    }

    let saveTimer = null;
    function throttledSaveProgress() {
        if (saveTimer) return;
        saveTimer = setTimeout(() => { saveCurrentProgress(); saveTimer = null; }, 3000);
    }

    async function loadVideoByIndex(index, restoreProgress = true) {
        if (!playlist.length || index < 0 || index >= playlist.length) { video.src = ''; return; }
        const file = playlist[index];
        const baseUrl = currentServer.replace(/\/+$/, '');
        let videoUrl = `${baseUrl}/d${file.path}`;
        if (file.sign) videoUrl += `?sign=${encodeURIComponent(file.sign)}`;
        video.src = videoUrl;
        video.load();
        const onLoaded = () => {
            if (restoreProgress) {
                const savedTime = progressMap.get(file.path) || 0;
                if (savedTime > 0) video.currentTime = savedTime;
            }
            video.play().catch(e => console.warn('自動播放失敗:', e.message));
            video.removeEventListener('loadedmetadata', onLoaded);
        };
        video.addEventListener('loadedmetadata', onLoaded);
        currentIndex = index;
        renderPlaylist();
        saveFullState();
    }

    function playNext() {
        if (!playlist.length) return;
        let next = currentIndex + 1;
        if (next >= playlist.length) next = 0;
        loadVideoByIndex(next, true);
    }

    function escapeHtml(s) {
        return s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]||m));
    }

    function renderPlaylist() {
        if (!playlist.length) {
            playlistContainer.innerHTML = `<div class="empty">— 暫無視頻，請加載列表 —</div>`;
            countBadge.innerText = '0 個';
            return;
        }
        let html = '';
        playlist.forEach((file, idx) => {
            const isActive = idx === currentIndex;
            const name = file.name || file.path.split('/').pop() || '未知';
            html += `<div class="item${isActive?' active':''}" data-index="${idx}">
                <span class="num">${String(idx+1).padStart(2,'0')}</span>
                <span class="name" title="${escapeHtml(name)}">${escapeHtml(name)}</span>
                ${isActive ? '<span class="play-icon"></span>' : ''}
            </div>`;
        });
        playlistContainer.innerHTML = html;
        document.querySelectorAll('.item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.index, 10);
                if (!isNaN(idx) && idx !== currentIndex) loadVideoByIndex(idx, true);
            });
        });
        countBadge.innerText = playlist.length + ' 個';
    }

    function updateCount() { countBadge.innerText = playlist.length + ' 個'; }

    async function fetchAlistList(server, path) {
        const apiUrl = server.replace(/\/+$/, '') + '/api/fs/list';
        const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: path||'/', password:'', page:1, per_page:0, refresh:false }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        if (result.code !== 200) throw new Error(result.message || '未知錯誤');
        const files = result.data?.content || [];
        const videoExt = ['.mp4','.mkv','.avi','.mov','.wmv','.flv','.webm','.m4v','.mpg','.mpeg'];
        return files
            .filter(f => !f.is_dir)
            .filter(f => videoExt.includes(f.name.substring(f.name.lastIndexOf('.')).toLowerCase()))
            .map(f => {
                let fullPath = f.path;
                if (!fullPath) {
                    const dir = path.replace(/\/+$/, '');
                    fullPath = dir === '' ? '/' + f.name : dir + '/' + f.name;
                    if (!fullPath.startsWith('/')) fullPath = '/' + fullPath;
                }
                return { name: f.name, path: fullPath, sign: f.sign||'', size: f.size };
            })
            .sort((a,b) => a.name.localeCompare(b.name));
    }

    async function handleLoadList() {
        const server = serverInput.value.trim();
        const path   = pathInput.value.trim() || '/';
        if (!server) { showError('請輸入 Alist 伺服器地址'); return; }
        const cleanServer = server.replace(/\/+$/, '');
        showError(null);
        loadListBtn.disabled = true;
        loadListBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="animation:spin .8s linear infinite"><path d="M6 1a5 5 0 0 1 0 10A5 5 0 0 1 1 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> 獲取中…`;
        try {
            const videoFiles = await fetchAlistList(cleanServer, path);
            if (!videoFiles.length) showError('該目錄下沒有找到視頻文件');
            currentServer = cleanServer; currentPath = path; playlist = videoFiles;
            const newMap = new Map();
            const existingPaths = new Set(videoFiles.map(f => f.path));
            for (let [k,v] of progressMap) if (existingPaths.has(k)) newMap.set(k,v);
            progressMap = newMap;
            currentIndex = videoFiles.length > 0 ? 0 : -1;
            renderPlaylist(); saveFullState();
            if (currentIndex >= 0) loadVideoByIndex(currentIndex, true);
            else video.src = '';
        } catch(err) {
            showError('加載失敗: ' + err.message);
        } finally {
            loadListBtn.disabled = false;
            loadListBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 6a5 5 0 0 1 9.5-2M11 6a5 5 0 0 1-9.5 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8.5 1.5 10.5 4l-2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> 加載列表`;
        }
    }

    function handleClearStorage() {
        if (!confirm('清除所有保存的播放列表和進度？')) return;
        localStorage.removeItem(STORAGE_KEY);
        playlist = []; currentIndex = -1; progressMap.clear();
        currentServer = ''; currentPath = '';
        video.src = ''; renderPlaylist(); updateCount();
        serverInput.value = ''; pathInput.value = '/'; showError(null);
    }

    function resetCurrentProgress() {
        if (currentIndex >= 0 && playlist[currentIndex]) {
            progressMap.delete(playlist[currentIndex].path);
            saveFullState(); video.currentTime = 0;
            showError('當前視頻進度已重置', 2000);
        }
    }

    function showError(msg, timeout = 5000) {
        if (!msg) { errorDiv.style.display='none'; errorDiv.innerText=''; return; }
        errorDiv.style.display='block'; errorDiv.innerText=msg;
        if (timeout > 0) setTimeout(() => errorDiv.style.display='none', timeout);
    }

    // Spin keyframe
    const style = document.createElement('style');
    style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
    document.head.appendChild(style);

    video.addEventListener('timeupdate', throttledSaveProgress);
    video.addEventListener('ended', function() {
        if (currentIndex >= 0 && playlist[currentIndex]) {
            progressMap.delete(playlist[currentIndex].path);
            saveFullState();
        }
        playNext();
    });
    video.addEventListener('error', function() {
        console.error('視頻錯誤', video.error);
        showError(`視頻加載失敗，3秒後嘗試下一個…`);
        setTimeout(() => { if (playlist.length > 1) playNext(); }, 3000);
    });

    loadListBtn.addEventListener('click', handleLoadList);
    clearStorageBtn.addEventListener('click', handleClearStorage);
    resetProgressBtn.addEventListener('click', resetCurrentProgress);

    (function init() {
        const restored = loadFromStorage();
        const server = serverInput.value.trim();
        if (server) {
            setTimeout(() => handleLoadList().catch(e => console.warn('自動加載失敗:', e.message)), 100);
        }
    })();

    window.addEventListener('beforeunload', saveCurrentProgress);
})();
</script>

<script>
(function(){
    const fsBtn          = document.getElementById('fsBtn');
    const fsIconExpand   = document.getElementById('fsIconExpand');
    const fsIconCompress = document.getElementById('fsIconCompress');
    const video          = document.getElementById('videoPlayer');

    function setFsBtnState(isFs) {
        fsBtn.classList.toggle('is-fullscreen', isFs);
        fsIconExpand.style.display   = isFs ? 'none' : '';
        fsIconCompress.style.display = isFs ? ''     : 'none';
        fsBtn.title = isFs ? '縮小並暫停' : '全螢幕播放';
    }

    function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
    }

    function enterFullscreen(el) {
        if (el.requestFullscreen)       return el.requestFullscreen();
        if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
        if (el.mozRequestFullScreen)    return el.mozRequestFullScreen();
    }

    function exitFullscreen() {
        if (document.exitFullscreen)       return document.exitFullscreen();
        if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
        if (document.mozCancelFullScreen)  return document.mozCancelFullScreen();
    }

    fsBtn.addEventListener('click', function() {
        if (isFullscreen()) {
            exitFullscreen();
            video.pause();
        } else {
            var videoWrap = document.querySelector('.video-wrap');
            enterFullscreen(videoWrap);
            video.play().catch(function(e){ console.warn('播放失敗:', e.message); });
        }
    });

    ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(evt) {
        document.addEventListener(evt, function(){ setFsBtnState(isFullscreen()); });
    });
})();

/* ─── Custom video controls ──────────────────────────── */
(function(){
    var vid        = document.getElementById('videoPlayer');
    var wrap       = document.querySelector('.video-wrap');
    var overlay    = document.getElementById('playOverlay');
    var overlayIco = document.getElementById('overlayIcon');
    var ctrlPlay   = document.getElementById('ctrlPlay');
    var ctrlPlayIco= document.getElementById('ctrlPlayIcon');
    var ctrlSkipB  = document.getElementById('ctrlSkipB');
    var ctrlSkipF  = document.getElementById('ctrlSkipF');
    var ctrlTime   = document.getElementById('ctrlTime');
    var ctrlFill   = document.getElementById('ctrlFill');
    var ctrlBuf    = document.getElementById('ctrlBuf');
    var ctrlThumb  = document.getElementById('ctrlThumb');
    var ctrlProgress= document.getElementById('ctrlProgress');
    var ctrlMute   = document.getElementById('ctrlMute');
    var ctrlVolIco = document.getElementById('ctrlVolIcon');
    var ctrlVol    = document.getElementById('ctrlVol');

    var PLAY_PATH  = 'M5 3l8 5-8 5V3z';
    var PAUSE_PATH = 'M4 3h3v10H4zM9 3h3v10H9z';
    var VOL_ON     = '<path d="M3 6H1v4h2l4 3V3L3 6z" fill="currentColor"/><path d="M11 5a3 3 0 0 1 0 6M13 3a6 6 0 0 1 0 10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>';
    var VOL_OFF    = '<path d="M3 6H1v4h2l4 3V3L3 6z" fill="currentColor"/><path d="M12 6l-3 4m0-4l3 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>';

    function fmt(s) {
        s = Math.floor(s||0);
        var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
        if (h) return h+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
        return m+':'+String(ss).padStart(2,'0');
    }

    function syncPlay() {
        var paused = vid.paused || vid.ended;
        ctrlPlayIco.setAttribute('d', paused ? PLAY_PATH : PAUSE_PATH);
        overlayIco.setAttribute('d', paused ? PLAY_PATH : PAUSE_PATH);
        overlay.classList.toggle('show', paused);
        ctrlPlay.classList.toggle('is-playing', !paused);
    }

    function syncVol() {
        ctrlVol.value = vid.muted ? 0 : vid.volume;
        ctrlVolIco.innerHTML = (vid.muted || vid.volume === 0) ? VOL_OFF : VOL_ON;
    }

    function syncProgress() {
        if (!vid.duration) return;
        var pct = vid.currentTime / vid.duration * 100;
        ctrlFill.style.width = pct + '%';
        ctrlThumb.style.left = pct + '%';
        // buffered
        if (vid.buffered.length) {
            var bpct = vid.buffered.end(vid.buffered.length-1) / vid.duration * 100;
            ctrlBuf.style.width = bpct + '%';
        }
        ctrlTime.textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
    }

    // Click on video area (not controls) = toggle play
    wrap.addEventListener('click', function(e) {
        if (e.target.closest('.ctrl-bar')) return;
        if (vid.paused) vid.play().catch(function(){});
        else vid.pause();
        spawnRipple(e);
    });

    function spawnRipple(e) {
        var r = wrap.getBoundingClientRect();
        var el = document.createElement('div');
        el.className = 'ripple';
        el.style.left = (e.clientX - r.left) + 'px';
        el.style.top  = (e.clientY - r.top)  + 'px';
        wrap.appendChild(el);
        setTimeout(function(){ el.remove(); }, 500);
    }

    ctrlPlay.addEventListener('click', function(e) {
        e.stopPropagation();
        if (vid.paused) vid.play().catch(function(){});
        else vid.pause();
    });
    ctrlSkipB.addEventListener('click', function(e){ e.stopPropagation(); vid.currentTime = Math.max(0, vid.currentTime-10); });
    ctrlSkipF.addEventListener('click', function(e){ e.stopPropagation(); vid.currentTime = Math.min(vid.duration||0, vid.currentTime+10); });

    // Progress scrubbing
    var scrubbing = false;
    function scrubTo(e) {
        var r = ctrlProgress.getBoundingClientRect();
        var pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
        if (vid.duration) vid.currentTime = pct * vid.duration;
    }
    ctrlProgress.addEventListener('mousedown', function(e){ e.stopPropagation(); scrubbing = true; scrubTo(e); });
    document.addEventListener('mousemove', function(e){ if (scrubbing) scrubTo(e); });
    document.addEventListener('mouseup',   function(){ scrubbing = false; });
    ctrlProgress.addEventListener('touchstart', function(e){ e.stopPropagation(); scrubbing = true; scrubTo(e.touches[0]); }, {passive:true});
    document.addEventListener('touchmove',  function(e){ if (scrubbing) scrubTo(e.touches[0]); }, {passive:true});
    document.addEventListener('touchend',   function(){ scrubbing = false; });

    // Volume
    ctrlMute.addEventListener('click', function(e){ e.stopPropagation(); vid.muted = !vid.muted; syncVol(); });
    ctrlVol.addEventListener('input', function(e){ e.stopPropagation(); vid.volume = parseFloat(ctrlVol.value); vid.muted = vid.volume===0; syncVol(); });
    ctrlVol.addEventListener('click', function(e){ e.stopPropagation(); });

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
        var tag = document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        if (e.code === 'Space')       { e.preventDefault(); if(vid.paused) vid.play().catch(function(){}); else vid.pause(); }
        if (e.code === 'ArrowLeft')   { e.preventDefault(); vid.currentTime = Math.max(0, vid.currentTime-10); }
        if (e.code === 'ArrowRight')  { e.preventDefault(); vid.currentTime = Math.min(vid.duration||0, vid.currentTime+10); }
        if (e.code === 'ArrowUp')     { e.preventDefault(); vid.volume = Math.min(1, vid.volume+0.1); vid.muted=false; syncVol(); }
        if (e.code === 'ArrowDown')   { e.preventDefault(); vid.volume = Math.max(0, vid.volume-0.1); syncVol(); }
        if (e.code === 'KeyM')        { vid.muted = !vid.muted; syncVol(); }
    });

    vid.addEventListener('play',       syncPlay);
    vid.addEventListener('pause',      syncPlay);
    vid.addEventListener('ended',      syncPlay);
    vid.addEventListener('timeupdate', syncProgress);
    vid.addEventListener('durationchange', syncProgress);
    vid.addEventListener('volumechange',   syncVol);

    syncPlay(); syncVol();
})();
</script>
